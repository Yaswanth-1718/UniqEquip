server.port=${PORT:8085}

# Spring Application Name
spring.application.name=univ-equipment-booking

# H2 Database configuration (file-based for persistence)
spring.datasource.url=jdbc:h2:file:./data/univ_equip_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console enable
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allow browser access via the public Render URL (requests arrive through
# Render's proxy, so H2 would otherwise reject them as "remote"). The
# in-app Admin -> Database Manager remains the recommended interface.
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON
spring.jackson.serialization.indent_output=true
spring.jackson.default-property-inclusion=non_null

# Email (SMTP via Gmail). Credentials come from environment variables only.
# The app starts and bookings work even when these are unset; email just stays FAILED/retryable.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Displayed sender and timezone for booking emails
app.mail.from=${MAIL_USERNAME:}
app.mail.from-name=${MAIL_FROM_NAME:UniqEquip}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
